# The omdsh-remctrl bundle patch: one row, inserted over whatever the profile
# already composed.
#
# This package is a PROFILE LAYER, not a harness edit. `dsh plugin --profile
# web add @omdsh-plugins/omdsh-remctrl` installs it into the profile directory
# and appends it to `dsh.profile.bundles`, so this file is applied after
# `@deepseek-ai/dsh-base` and `@deepseek-ai/dsh-web-app` — the harness tree
# stays exactly as it shipped, and removing the plugin removes the row with it.
#
# ## Why this row opens a second listener instead of registering a route
#
# Every other plugin in this directory hangs its routes on `ctx.webServer`.
# This one puts a listener of its own IN FRONT of that one, and the reason is
# a fact about the harness rather than a preference:
#
#   - `WebServer.Config` validates its bind host against a RUNTIME schema
#     admitting only `127.0.0.1` and `0.0.0.0`, and the web app's CLI refuses
#     `--host 0.0.0.0` outright, in as many words: it would expose remote code
#     execution to the network. The harness carrier therefore cannot be put
#     anywhere a phone can reach.
#   - It cannot, because it has no authentication of its own. Which is exactly
#     what this plugin adds: a passcode, a session cookie, a throttle, and a
#     transport check, all in front, and then the harness's own interface
#     forwarded verbatim behind them.
#
# So the row does not move the harness's door. It puts a door in front of it,
# and that door is the only thing on the public address.
#
# ## What the row injects, and what it does not
#
# The row injects `connection`: the desktop card reaches the host half over
# `ctx.connection.rpc` at `authority: 'loopback'`.
#
# It does NOT inject `webServer`, which is what the forward needs, or
# `settings`, which is where the passcode lives. Both are taken on nested
# `ctx.inject` calls inside `apply` instead, so a profile composing no web
# interface gets a plugin that says there is nothing to forward rather than a
# boot that never finishes.
#
# What must NOT be read into that: an entry waiting for a service nobody
# composed does not quietly stay off. cordis's inject wait has no timeout and
# the boot audit fails the whole app for any entry left `pending`, so adding
# this row to a headless profile — which composes no `connection` — is a dead
# boot, not a disabled feature.
#
# The browser half needs no row here at all: `dsh.client` in package.json is
# what the shell reads to fetch `lib/client.js`, and the card it registers goes
# into a slot `@omdsh-plugins/omdsh-plughub` declares. Install the hub and the
# card appears; remove it and the card withdraws.
#
# ## The row composes nothing
#
# No config here, deliberately. `enabled` defaults to `false` in the schema, so
# installing this plugin changes nothing about the machine until somebody opens
# its card and turns it on. A composition entry that set `enabled: true` would
# put a harness on the internet as a side effect of an install.

- insert:
    - id: omdsh-remctrl
      name: '@omdsh-plugins/omdsh-remctrl'
